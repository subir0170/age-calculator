<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Age Calculator</title>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; }
        * { box-sizing: border-box; }
        
        /* Sticky Footer Structure */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        .content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 600px; 
            margin-top: 20px;
        }
        
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        input, button { padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; outline: none; }
        button { background: var(--primary); color: white; border: none; grid-column: span 2; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #4f46e5; }
        
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { padding: 20px; border-radius: 20px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .card h3 { font-size: 11px; color: #64748b; text-transform: uppercase; margin: 0 0 8px 0; }
        .card p { font-size: 17px; font-weight: 700; color: #0f172a; margin: 0; }
        
        .full-width { grid-column: 1 / -1; }
        
        footer { padding: 20px; text-align: center; color: #64748b; font-weight: 500; font-size: 14px; }
        footer span {
          font-size: 16px;
          font-weight: 700;
          color: #6366F1;
        }

        /* Modal & Animations */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 40px; border-radius: 30px; text-align: center; }
        .balloon { position: absolute; font-size: 40px; bottom: -50px; animation: rise 5s infinite linear; }
        @keyframes rise { to { bottom: 110%; } }
        
        @media (max-width: 480px) { 
            .inputs { grid-template-columns: 1fr; } 
            button { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <audio id="bdayAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <div class="content">
        <div class="container">
            <h2>Age Calculator</h2>
            <div class="inputs">
                <input type="date" id="dob">
                <input type="time" id="tob" value="00:00">
                <button onclick="calculate()">Calculate Now</button>
            </div>

            <div class="results-grid" id="resultArea" style="display: none;">
                <div class="card" style="background: #eff6ff;"><h3>Age</h3><p id="resAge">-</p></div>
                <div class="card" style="background: #f5f3ff;"><h3>Next B'day</h3><p id="resNext">-</p></div>
                <div class="card" style="background: #fefce8;"><h3>Zodiac</h3><p id="resZodiac">-</p></div>
                <div class="card" style="background: #fff1f2;"><h3>Status</h3><p id="resStatus">-</p></div>
                
                <div class="card full-width" style="background: #f0fdf4;">
                    <h3>Live Time Lived</h3>
                    <p id="resLive" style="font-family: monospace;"></p>
                </div>
                
                <div class="card full-width" style="background: #f8fafc;">
                    <h3>Approx Heartbeats</h3>
                    <p id="resHeart">-</p>
                </div>
            </div>
        </div>
    </div>

    <footer>Created by <span>Subir Datta</span></footer>

    <div id="bdayModal" class="modal">
        <div class="balloon" style="left: 10%; animation-delay: 0s;">🎈</div>
        <div class="balloon" style="left: 30%; animation-delay: 1.5s;">🎈</div>
        <div class="balloon" style="left: 50%; animation-delay: 0.5s;">🎈</div>
        <div class="balloon" style="left: 70%; animation-delay: 2s;">🎈</div>
        <div class="balloon" style="left: 90%; animation-delay: 1s;">🎈</div>
        <div class="modal-content">
            <h1>🎉 Happy Birthday!</h1>
            <p>Enjoy your special day!</p>
            <button onclick="closeModal()" style="background: #ef4444; color: white; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer;">Close & Stop</button>
        </div>
    </div>

    <script>
        let timerInterval;

        function calculate() {
            const dobVal = document.getElementById('dob').value;
            if (!dobVal) return alert("Please select your birth date!");
            
            const dob = new Date(dobVal + "T" + document.getElementById('tob').value);
            const now = new Date();
            
            let years = now.getFullYear() - dob.getFullYear();
            let months = now.getMonth() - dob.getMonth();
            if(months < 0) { years--; months += 12; }
            
            document.getElementById('resAge').innerText = `${years}y ${months}m`;
            
            let next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
            if(next < now) next.setFullYear(now.getFullYear() + 1);
            document.getElementById('resNext').innerText = Math.ceil((next - now)/(1000*60*60*24)) + " days";
            
            document.getElementById('resZodiac').innerText = getZodiac(dob.getMonth()+1, dob.getDate());
            document.getElementById('resStatus').innerText = years >= 18 ? "Adult" : "Minor";

            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = new Date() - dob;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('resLive').innerText = `${d} Days : ${h} Hours : ${m} Min : ${s} Sec`;
                document.getElementById('resHeart').innerText = (Math.floor(diff / 60000) * 72).toLocaleString() + " beats";
            }, 1000);

            document.getElementById('resultArea').style.display = 'grid';

            if (now.getMonth() === dob.getMonth() && now.getDate() === dob.getDate()) {
                document.getElementById('bdayModal').style.display = 'flex';
                document.getElementById('bdayAudio').play();
            }
        }

        function getZodiac(m, d) {
            const signs = ["Capricorn", "Aquarius", "Pisces", "Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius"];
            const days = [19, 18, 20, 19, 20, 20, 22, 22, 22, 22, 21, 21];
            return d > days[m - 1] ? signs[m] || signs[0] : signs[m - 1];
        }

        function closeModal() {
            document.getElementById('bdayModal').style.display = 'none';
            const audio = document.getElementById('bdayAudio');
            audio.pause();
            audio.currentTime = 0;
        }
    </script>
</body>
</html>
